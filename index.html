
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pesan dari Kedai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5f2;
            color: #29231f;
            font: 15px/1.45 Arial, sans-serif;
        }

        .top {
            background: #4a3024;
            color: white;
            padding: 20px;
        }

        .wrap {
            max-width: 1050px;
            margin: auto;
            padding: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e7e0da;
            border-radius: 14px;
            padding: 15px;
            margin: 12px 0;
        }

        .hidden {
            display: none !important;
        }

        input,
        select,
        textarea,
        button {
            font: inherit;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 9px;
            width: 100%;
        }

        button {
            background: #6f4e37;
            color: white;
            border: 0;
            font-weight: bold;
            cursor: pointer;
        }

        .secondary {
            background: #eee6df;
            color: #3e2c22;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
        }

        .product {
            overflow: hidden;
            border: 1px solid #eee;
            border-radius: 12px;
            background: white;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #eee;
        }

        .product .inside {
            padding: 12px;
        }

        .product h3 {
            margin: 0 0 5px;
        }

        .muted {
            color: #766b63;
        }

        .price {
            font-weight: bold;
            color: #6f4e37;
            font-size: 18px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row > * {
            flex: 1;
        }

        .msg {
            padding: 10px;
            background: #e9f5ec;
            border-radius: 8px;
            color: #14532d;
            margin: 10px 0;
        }

        .err {
            background: #fee2e2;
            color: #991b1b;
        }

        .pill {
            background: #eee6df;
            padding: 4px 9px;
            border-radius: 30px;
            font-size: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            margin: 8px 0 4px;
            color: #766b63;
        }

        form {
            display: grid;
            gap: 8px;
        }

        .cartline {
            display: grid;
            grid-template-columns: 1fr 75px 85px;
            gap: 8px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .cartline input {
            padding: 8px;
        }

        .sticky {
            position: sticky;
            bottom: 0;
            background: #f7f5f2;
            padding: 8px 0;
        }

        @media (max-width: 550px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .product img {
                height: 115px;
            }

            .product .inside {
                padding: 9px;
            }

            .cartline {
                grid-template-columns: 1fr 60px 75px;
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="wrap">
            <h1 id="cafeName">☕ Kedai Kopi</h1>
            <p>Pesan makanan dan minuman favoritmu</p>
        </div>
    </header>

    <div class="wrap">
        <!-- LOGIN PELANGGAN -->
        <section
            id="login"
            class="card"
            style="max-width: 480px; margin: 20px auto;"
        >
            <h2>Mulai pesan</h2>
            <p class="muted">
                Masukkan nama, nomor HP, dan nomor meja.
            </p>

            <div id="loginMsg"></div>

            <form id="loginForm">
                <div>
                    <label>Nama</label>
                    <input
                        id="name"
                        required
                        minlength="2"
                        placeholder="Nama kamu"
                    >
                </div>

                <div>
                    <label>Nomor WhatsApp / HP</label>
                    <input
                        id="phone"
                        required
                        placeholder="08xxxxxxxxxx"
                    >
                </div>

                <div>
                    <label>Nomor meja</label>
                    <select id="table" required>
                        <option value="">Pilih meja</option>
                    </select>
                </div>

                <button type="submit">Masuk ke katalog</button>
            </form>
        </section>

        <!-- HALAMAN KATALOG DAN PESANAN -->
        <section id="shop" class="hidden">
            <div class="card">
                <div class="row">
                    <div>
                        <h2>Katalog</h2>
                        <small id="customerLabel" class="muted"></small>
                    </div>

                    <button
                        type="button"
                        class="secondary"
                        style="max-width: 120px;"
                        onclick="logout()"
                    >
                        Ganti pelanggan
                    </button>
                </div>
            </div>

            <!-- DAFTAR MENU -->
            <div id="products" class="grid"></div>

            <!-- KERANJANG -->
            <div class="card">
                <h2>Keranjang</h2>

                <div id="cart"></div>

                <label>Catatan pesanan (opsional)</label>
                <textarea
                    id="orderNote"
                    placeholder="Contoh: es sedikit, tanpa bawang"
                ></textarea>

                <div class="row">
                    <div>
                        <small class="muted">Total</small>
                        <div id="total" class="price">Rp0</div>
                    </div>

                    <button type="button" onclick="submitOrder()">
                        Kirim pesanan
                    </button>
                </div>

                <div id="orderMsg"></div>
            </div>

            <!-- RIWAYAT PESANAN -->
            <div class="card">
                <h2>Pesanan saya</h2>

                <button
                    type="button"
                    class="secondary"
                    onclick="loadMyOrders()"
                >
                    Perbarui status pesanan
                </button>

                <div id="myOrders"></div>
            </div>
        </section>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxaKorbDhTjPBPbFT5Ktti3DSa_wFnYF7ncLZIIEHOkWs8s0_bGssGmufKEl5hxu0z1/exec";

        let customer = null;
        let cart = {};
        let menuList = [];

        const $ = id => document.getElementById(id);

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#39;"
            }[c]));
        }

        function money(n) {
            return new Intl.NumberFormat("id-ID", {
                style: "currency",
                currency: "IDR",
                maximumFractionDigits: 0
            }).format(Number(n) || 0);
        }

        function uid() {
            return "c_" + crypto
                .getRandomValues(new Uint32Array(4))
                .join("_");
        }

        function getJSONP(action, params = {}) {
            return new Promise((resolve, reject) => {
                const cb = "cb_" + Math.random().toString(36).slice(2);
                const s = document.createElement("script");

                const t = setTimeout(() => {
                    cleanup();
                    reject(Error("API timeout"));
                }, 15000);

                function cleanup() {
                    clearTimeout(t);
                    delete window[cb];
                    s.remove();
                }

                window[cb] = d => {
                    cleanup();

                    d.ok
                        ? resolve(d)
                        : reject(Error(d.error || "Gagal"));
                };

                s.onerror = () => {
                    cleanup();
                    reject(Error("Gagal menghubungi server"));
                };

                s.src = API
                    + "?action=" + encodeURIComponent(action)
                    + "&callback=" + cb
                    + "&" + new URLSearchParams(params);

                document.body.appendChild(s);
            });
        }

        async function post(data) {
            return fetch(API, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(data)
            });
        }

        // LOGIN PELANGGAN
        $("loginForm").onsubmit = async e => {
            e.preventDefault();

            try {
                const token = uid();

                customer = {
                    name: $("name").value.trim(),
                    phone: $("phone").value.trim(),
                    table: $("table").value,
                    token
                };

                await post({
                    action: "createCustomerSession",
                    name: customer.name,
                    phone: customer.phone,
                    customerToken: token
                });

                await new Promise(resolve => setTimeout(resolve, 400));

                sessionStorage.setItem(
                    "cafeCustomer",
                    JSON.stringify(customer)
                );

                await showShop();
            } catch (err) {
                $("loginMsg").innerHTML =
                    '<div class="msg err">'
                    + esc(err.message)
                    + "</div>";
            }
        };

        // TAMPILKAN KATALOG
        async function showShop() {
            if (!customer) return;

            $("login").classList.add("hidden");
            $("shop").classList.remove("hidden");

            $("customerLabel").textContent =
                customer.name + " • Meja " + customer.table;

            const r = await getJSONP("menu");

            menuList = r.menu || [];

            $("products").innerHTML = menuList.map(m => `
                <article class="product">
                    <img
                        src="${esc(m.FotoURL || "https://placehold.co/600x400?text=Menu")}"
                        alt="${esc(m.Nama)}"
                        onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=Menu'"
                    >

                    <div class="inside">
                        <span class="pill">
                            ${esc(m.Kategori || "Menu")}
                        </span>

                        <h3>${esc(m.Nama)}</h3>

                        <p class="muted">
                            ${esc(m.Deskripsi || "")}
                        </p>

                        <div class="price">${money(m.Harga)}</div>

                        <button
                            type="button"
                            style="margin-top: 9px;"
                            onclick="add('${esc(m.MenuID)}')"
                        >
                            Tambah
                        </button>
                    </div>
                </article>
            `).join("");

            drawCart();
            await loadMyOrders();
        }

        // TAMBAH MENU KE KERANJANG
        function add(id) {
            const m = menuList.find(
                x => String(x.MenuID) === String(id)
            );

            if (!m) return;

            if (!cart[id]) {
                cart[id] = {
                    id,
                    qty: 0,
                    note: ""
                };
            }

            cart[id].qty = Math.min(99, cart[id].qty + 1);

            drawCart();
        }

        // UBAH JUMLAH MENU
        function changeQty(id, v) {
            if (Number(v) <= 0) {
                delete cart[id];
            } else {
                cart[id].qty = Math.min(
                    99,
                    Math.floor(Number(v) || 1)
                );
            }

            drawCart();
        }

        // CATATAN PER MENU
        function changeNote(id, v) {
            if (cart[id]) {
                cart[id].note = v;
            }
        }

        // TAMPILKAN KERANJANG
        function drawCart() {
            const lines = Object.values(cart);

            $("cart").innerHTML = lines.length
                ? lines.map(x => {
                    const m = menuList.find(
                        a => String(a.MenuID) === String(x.id)
                    );

                    if (!m) return "";

                    return `
                        <div class="cartline">
                            <div>
                                <b>${esc(m.Nama)}</b>
                                <br>
                                <small>${money(m.Harga)} / item</small>

                                <input
                                    placeholder="Catatan menu"
                                    value="${esc(x.note)}"
                                    onchange="changeNote('${esc(x.id)}', this.value)"
                                >
                            </div>

                            <input
                                type="number"
                                min="1"
                                max="99"
                                value="${x.qty}"
                                onchange="changeQty('${esc(x.id)}', this.value)"
                            >

                            <b>${money(Number(m.Harga) * x.qty)}</b>
                        </div>
                    `;
                }).join("")
                : '<p class="muted">Keranjang masih kosong.</p>';

            const total = lines.reduce((a, x) => {
                const m = menuList.find(
                    item => String(item.MenuID) === String(x.id)
                );

                return a + (Number(m?.Harga) || 0) * x.qty;
            }, 0);

            $("total").textContent = money(total);
        }

        // KIRIM PESANAN
        async function submitOrder() {
            const items = Object.values(cart);

            if (!items.length) {
                $("orderMsg").innerHTML =
                    '<div class="msg err">Keranjang masih kosong.</div>';

                return;
            }

            try {
                await post({
                    action: "createOrder",
                    customerToken: customer.token,
                    table: customer.table,
                    note: $("orderNote").value,
                    items
                });

                $("orderMsg").innerHTML =
                    '<div class="msg">'
                    + "Pesanan dikirim. Tunggu sebentar lalu "
                    + "perbarui status pesanan."
                    + "</div>";

                cart = {};
                $("orderNote").value = "";

                drawCart();

                setTimeout(loadMyOrders, 1200);
            } catch (e) {
                $("orderMsg").innerHTML =
                    '<div class="msg err">'
                    + esc(e.message)
                    + "</div>";
            }
        }

        // RIWAYAT PESANAN PELANGGAN
        async function loadMyOrders() {
            if (!customer) return;

            try {
                const r = await getJSONP("customerOrders", {
                    customerToken: customer.token
                });

                $("myOrders").innerHTML = r.orders.length
                    ? r.orders.map(o => `
                        <div class="card">
                            <b>${esc(o.OrderID)}</b>
                            • Meja ${esc(o.Meja)}

                            <br>

                            <span class="pill">
                                ${esc(o.Status)}
                            </span>

                            <p>${money(o.Total)}</p>

                            <small class="muted">
                                ${esc(
                                    String(o.Waktu)
                                        .slice(0, 16)
                                        .replace("T", " ")
                                )}
                            </small>
                        </div>
                    `).join("")
                    : '<p class="muted">Belum ada pesanan.</p>';
            } catch (e) {
                $("myOrders").textContent =
                    "Status belum dapat dimuat.";
            }
        }

        // GANTI PELANGGAN
        function logout() {
            customer = null;
            cart = {};

            sessionStorage.removeItem("cafeCustomer");

            $("shop").classList.add("hidden");
            $("login").classList.remove("hidden");
        }

        // INISIALISASI APLIKASI
        (async () => {
            try {
                const s = await getJSONP("settings");

                $("cafeName").textContent =
                    "☕ " + (s.settings.NamaKafe || "Kedai Kopi");

                const max = Math.max(
                    1,
                    Number(s.settings.NomorMejaMaks) || 30
                );

                for (let i = 1; i <= max; i++) {
                    $("table").insertAdjacentHTML(
                        "beforeend",
                        `<option value="${i}">Meja ${i}</option>`
                    );
                }
            } catch (e) {
                $("loginMsg").innerHTML =
                    '<div class="msg err">'
                    + "Gagal memuat pengaturan. Periksa URL backend."
                    + "</div>";
            }

            const saved = sessionStorage.getItem("cafeCustomer");

            if (saved) {
                try {
                    customer = JSON.parse(saved);
                    await showShop();
                } catch (e) {
                    customer = null;
                    sessionStorage.removeItem("cafeCustomer");
                }
            }
        })();
    </script>
</body>
</html>
